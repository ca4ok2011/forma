<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#131A21; --muted:#5F6B78; --line:#DDE3E9;
  --food:#DB5327; --food-soft:#FBE4DA; --water:#1C74D9; --water-soft:#DAE9FA; --food-grad:linear-gradient(135deg,#F0804C,#D0461B); --water-grad:linear-gradient(135deg,#4A9BF0,#1564C0); --gym:#3A8A20; --gym-soft:#E3F2D6; --gym-on:#fff; --gym-grad:linear-gradient(135deg,#62BC38,#3A8A20); --on-acc:#fff; --weight:#0E8C84; --weight-soft:#D7F1EE; --walk:#6A4BD6; --walk-soft:#ECE7FC; --walk-grad:linear-gradient(135deg,#9479F2,#5A3CC6); --ach:#B7791F; --ach-soft:#FBF0D9; --ach-grad:linear-gradient(135deg,#F4C45A,#C98A12); --home:#1F2A36; --home-soft:#E3E8EE;
  --good:#17905A; --warn:#C67C00; --shadow:0 1px 2px rgba(19,26,33,.06),0 6px 18px rgba(19,26,33,.06); --bodyc:#C3CCD6; --wgf:invert(1) brightness(.35) contrast(1.4);
  --acc:var(--food); --acc-soft:var(--food-soft);
  --display:"Unbounded","Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0D1216; --surface:#161D24; --surface-2:#1E2730; --ink:#E6ECF2; --muted:#8E9BA8; --line:#29333D;
    --food:#FF7C4F; --food-soft:#3A2117; --water:#4FA2FF; --water-soft:#132A44; --food-grad:linear-gradient(135deg,#FFA072,#F2622E); --water-grad:linear-gradient(135deg,#86C2FF,#3D8BF0); --ach:#F2C14E; --ach-soft:#322711; --ach-grad:linear-gradient(135deg,#F7D27A,#D9A02A); --walk:#A995FF; --walk-soft:#241E3F; --walk-grad:linear-gradient(135deg,#BCA9FF,#7F63EE); --gym:#A6DF6A; --gym-soft:#1E2A15; --gym-on:#10200A; --gym-grad:linear-gradient(135deg,#C6F28E,#86CC4E); --weight:#3CC7BC; --weight-soft:#12302E; --home:#E6ECF2; --home-soft:#26303B;
    --good:#3CC585; --warn:#F0A83A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --bodyc:#3E4A58; --wgf:brightness(.92);}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0D1216; --surface:#161D24; --surface-2:#1E2730; --ink:#E6ECF2; --muted:#8E9BA8; --line:#29333D;
  --food:#FF7C4F; --food-soft:#3A2117; --water:#4FA2FF; --water-soft:#132A44; --food-grad:linear-gradient(135deg,#FFA072,#F2622E); --water-grad:linear-gradient(135deg,#86C2FF,#3D8BF0); --ach:#F2C14E; --ach-soft:#322711; --ach-grad:linear-gradient(135deg,#F7D27A,#D9A02A); --walk:#A995FF; --walk-soft:#241E3F; --walk-grad:linear-gradient(135deg,#BCA9FF,#7F63EE); --gym:#A6DF6A; --gym-soft:#1E2A15; --gym-on:#10200A; --gym-grad:linear-gradient(135deg,#C6F28E,#86CC4E); --weight:#3CC7BC; --weight-soft:#12302E; --home:#E6ECF2; --home-soft:#26303B;
  --good:#3CC585; --warn:#F0A83A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --bodyc:#3E4A58; --wgf:brightness(.92);}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.m-food{--acc:var(--food);--acc-soft:var(--food-soft);--acc-grad:var(--food-grad)}
.m-water{--acc:var(--water);--acc-soft:var(--water-soft);--acc-grad:var(--water-grad)}
.m-gym{--acc:var(--gym);--acc-soft:var(--gym-soft);--on-acc:var(--gym-on);--acc-grad:var(--gym-grad)}
.btn:disabled,.btn:disabled:hover{background:var(--surface-2)!important;color:var(--muted)!important;opacity:.55;cursor:not-allowed;box-shadow:none}
.btn:not(.ghost):not(.danger):not(.addown):not(:disabled),.vol,.plusbtn,.day.done,.cd.full{background:var(--acc-grad,var(--acc))}
.m-gym .day.done{border-color:transparent}
.m-weight{--acc:var(--weight);--acc-soft:var(--weight-soft)}
.m-ach{--acc:var(--ach);--acc-soft:var(--ach-soft);--acc-grad:var(--ach-grad);--on-acc:#fff}
.m-walk{--acc:var(--walk);--acc-soft:var(--walk-soft);--acc-grad:var(--walk-grad);--on-acc:#fff}
.m-home{--acc:var(--home);--acc-soft:var(--home-soft)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.brand{display:flex;flex-direction:column}
.brand h1{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.nav button.arrow{width:38px;height:38px;border:0;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.nav .label{text-align:center;font-weight:700}
.nav .label small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.nav .label button{border:0;background:none;font-weight:700;padding:4px 8px;border-radius:8px}

.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c-bg{stroke:var(--acc-soft);fill:none}
.ring .c-fg{stroke:var(--acc);fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring.over .c-fg{stroke:var(--bad)}
.ring.over .c-bg{stroke:var(--bad-soft)}
.ring.over .in .big{color:var(--bad)}
:root{--bad:#D93A3F;--bad-soft:#FBDCDD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bad:#FF5F5F;--bad-soft:#3A1C1E}}
:root[data-theme="dark"]{--bad:#FF5F5F;--bad-soft:#3A1C1E}
.badc{color:var(--bad)!important}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.05}
.ring .in small{color:var(--muted);font-size:12px}
.stats{display:flex;flex-direction:column;gap:10px;min-width:0}
.stat b{font-family:var(--display);font-weight:500;font-size:17px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macro .bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.macro .bar i{display:block;height:100%;border-radius:4px}
.macro .t{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 4px}
.macro b{font-size:14px}

/* meals */
.meal{padding:0}
.meal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.meal-h h3{margin:0;font-size:16px}
.meal-h .kc{font-size:13px;color:var(--muted)}
.add{border:0;background:var(--acc-soft);color:var(--acc);font-weight:700;border-radius:10px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px}
.items{list-style:none;margin:0;padding:0 0 6px}
.items li{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line)}
.items .nm{flex:1;min-width:0}
.items .nm div{font-weight:600;line-height:1.3}
.items .nm small{color:var(--muted);font-size:12px}
.items .kcal{font-weight:700;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.del:hover{background:var(--surface-2);color:var(--ink)}
.empty{padding:2px 16px 14px;color:var(--muted);font-size:13px}

/* water */
.glass-wrap{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center}
.glass{position:relative;width:120px;height:190px;border-radius:14px 14px 30px 30px;border:3px solid var(--acc);overflow:hidden;background:var(--surface-2)}
.glass .fill{position:absolute;left:0;right:0;bottom:0;background:var(--acc);transition:height .6s ease}
.glass .wave{position:absolute;left:0;width:200%;height:14px;top:-10px;animation:wave 4s linear infinite}
.glass .wave path{fill:var(--acc)}
.wdone .wbar2 i{background:linear-gradient(90deg,#5CD394,var(--good))}.wdone .wbar2{background:color-mix(in srgb,var(--good) 18%,transparent)}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.glass .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink);mix-blend-mode:normal}
.glass .pct span{background:var(--surface);padding:2px 8px;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.vols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.vol{border:0;border-radius:14px;background:var(--acc);color:var(--on-acc,#fff);padding:12px 4px;font-weight:800;font-size:15px}
.vol small{display:block;font-weight:600;font-size:11px;opacity:.85}
.custom{display:flex;gap:8px;margin-top:10px}
/* no zoom: pan only (blocks pinch + double-tap zoom in Chrome/Android/iOS 13+) */
html,body,*{touch-action:pan-x pan-y}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:max(16px,1em)}
img,svg{-webkit-user-drag:none}
@media (hover:none) and (pointer:coarse){input,select,textarea,.field,.f .field{font-size:16px!important}}
.field{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.field:focus{outline:none;border-color:var(--acc)}
.btn{border:0;border-radius:12px;background:var(--acc);color:var(--on-acc,#fff);font-weight:700;padding:11px 16px;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:100px;position:relative;margin-top:6px}
.wbars .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6;z-index:1}
.wbar{display:flex;align-items:flex-end;justify-content:center;height:100%}
.wbar i{display:block;width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--acc-soft);min-height:3px}
.wbar.ok i{background:var(--acc)}
.wlabels{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;margin-top:4px}
.wlabels small{font-size:11px;color:var(--muted)}
.wlabels small.sel{color:var(--ink);font-weight:800}
.breakdown{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin:4px 0 10px}

/* gym */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:84px}
.day .wd{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.day .dn{font-family:var(--display);font-weight:500;font-size:18px}
.day.today{border-color:var(--acc)}
.day.done{background:var(--acc);border-color:var(--acc);color:var(--on-acc,#fff)}
.day.done .wd{color:var(--on-acc,#fff);opacity:.8}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:0 3px;font-size:9px;font-weight:700;line-height:1.2}
.dots span{background:rgba(255,255,255,.22);border-radius:4px;padding:0 3px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px}
.mline{display:grid;grid-template-columns:92px 1fr 22px;gap:8px;align-items:center;font-size:13px}
.mline .bar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.mline .bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.mline b{text-align:right}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line)}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .line{stroke:var(--acc);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--acc);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--acc);stroke-width:2}
.chart .pt.last{fill:var(--acc)}
.chart .lab{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--body)}
.pr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pr div{background:var(--surface-2);border-radius:12px;padding:10px}
.pr b{display:block;font-family:var(--display);font-weight:600;font-size:19px;margin-bottom:2px}
.pr span{font-size:12.5px;color:var(--muted);line-height:1.3}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{font-size:11px;color:var(--muted);font-weight:700;text-align:center;padding-bottom:4px}
.cd{border:1.5px solid transparent;background:var(--surface-2);border-radius:10px;min-height:52px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;min-width:0}
.cd.empty{background:none}
.cd .d{font-size:13px;font-weight:700}
.cd .v{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;max-width:100%}
.cd.ok{background:var(--acc-soft)}
.cd.ok .v{color:var(--ink)}
.cd.over{background:var(--acc-soft);border-color:var(--warn)}
.cd.over .v{color:var(--warn)}
.cd.today .d{color:var(--acc)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(4,6,9,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:stretch;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px);box-shadow:0 0 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{flex:none}
.sheet-b{flex:1;min-height:0}

.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px;background:var(--bg)}
.sheet-h h3{margin:0;font-size:18px}
.sheet-b{overflow-y:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:12px}
.sheet-b > *{flex-shrink:0}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.seg.ic button{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px;padding:10px 6px}
.seg.ic button svg{width:18px;height:18px;flex:none;display:block}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.results{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.results li button{width:100%;border:0;background:none;text-align:left;padding:11px 14px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line)}
.results li:first-child button{border-top:0}
.results li button:hover{background:var(--surface-2)}
.results small{color:var(--muted)}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:4px 2px -4px}
.pick{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.f .field{color:var(--ink);font-size:15px;font-weight:500}
.sum{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding-bottom:6px}
.sum b{font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink)}
.myp{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.myp li{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);padding-right:6px}
.myp li:first-child{border-top:0}
.myp li > button:first-child{flex:1;min-width:0;border:0;background:none;text-align:left;padding:11px 14px;display:flex;flex-direction:column}
.myp li > button:first-child small{color:var(--muted)}
.ex{background:var(--surface);border-radius:14px;padding:12px}
.ex-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ex-h b{font-size:15px}
.ex-h small{color:var(--muted)}
.pset{background:var(--surface-2);border-radius:14px;padding:8px;margin-top:8px}
.pset .stp{background:var(--surface)}
.pset-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pset-h .del{border:0;background:none;color:var(--muted);width:28px;height:28px;display:grid;place-items:center}
.stps.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.set{display:grid;grid-template-columns:26px 1fr 14px 1fr 32px;gap:6px;align-items:center;margin-top:6px}
.set .n{font-size:12px;color:var(--muted);font-weight:700;text-align:center}
.set .x{color:var(--muted);text-align:center}
.set input{text-align:center;padding:8px 6px}
.hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:60;font-weight:600;font-size:14px;width:max-content;max-width:calc(100% - 32px)}
.toast{pointer-events:none;opacity:0;transform:translate(-50%,18px) scale(.94);transition:opacity .25s ease,transform .45s cubic-bezier(.2,1.3,.35,1);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.out{opacity:0;transform:translate(-50%,14px) scale(.96);transition:opacity .3s ease,transform .35s ease-in}
.toast.bump{animation:tbump .3s ease}
@keyframes tbump{0%{transform:translate(-50%,0) scale(1)}40%{transform:translate(-50%,0) scale(1.05)}100%{transform:translate(-50%,0) scale(1)}}
body.sheet-open .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-18px) scale(.94)}
body.sheet-open .toast.show{transform:translate(-50%,0) scale(1)}
body.sheet-open .toast.out{transform:translate(-50%,-14px) scale(.96)}
.toast button{pointer-events:auto;border:0;background:none;color:var(--bg);font-weight:800;text-decoration:underline}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:420px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .stats{flex-direction:row;justify-content:space-around;width:100%}
  .glass-wrap{grid-template-columns:100px 1fr;gap:14px}
  .glass{width:100px;height:170px}
  .mgrid{grid-template-columns:1fr}
  .day{min-height:76px}
  .day .dn{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const getDay = k => S.days[k] || blankDay();
const gymEmpty = g => !g || (!(g.exercises||[]).length && !(g.muscles||[]).length && !(g.note||'').trim());

/* ---------- storage ----------
   Rules that keep data from "jumping back":
   • every change is stamped with a time (_ts): per day, and per setting field;
   • a change stays marked "dirty" until the cloud has confirmed it (survives reloads / closing the app);
   • when cloud and device disagree, the newer stamp wins field by field — an old copy never overwrites a newer value;
   • the local copy is written to localStorage and mirrored to IndexedDB (survives iOS killing the app mid-save). */
let db = null;
const pending = new Set();
const timers = {};
const chains = {};
const gens = {};
let setBase = null;
let localSeq = 0;
const stable = v => JSON.stringify(v, (k, x) => (x && typeof x==='object' && !Array.isArray(x)) ? Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}) : x);
function readJSON(key, def){ try{ const v = JSON.parse(localStorage.getItem(key)||'null'); return v==null ? def : v; }catch(e){ return def; } }
function writeJSON(key, v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }
/* IndexedDB mirror */
let idbP = null;
function idb(){ if (idbP) return idbP; idbP = new Promise(res => { try{ const r = indexedDB.open('forma', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }catch(e){ res(null); } }); return idbP; }
function idbPut(val){ idb().then(d => { if (!d) return; try{ d.transaction('kv','readwrite').objectStore('kv').put(val, 'cache'); }catch(e){} }); }
function idbGet(){ return idb().then(d => new Promise(res => { if (!d) return res(null); try{ const q = d.transaction('kv').objectStore('kv').get('cache'); q.onsuccess = () => res(q.result||null); q.onerror = () => res(null); }catch(e){ res(null); } })); }
function cacheLocal(){ localSeq = Math.max(localSeq+1, Date.now()); const c = {seq:localSeq, days:S.days, settings:S.settings}; try{ localStorage.setItem('forma.cache', JSON.stringify(c)); }catch(e){} idbPut(JSON.parse(JSON.stringify(c))); }
function applyCache(c){ S.days = c.days||{}; Object.values(S.days).forEach(normDay); S.settings = Object.assign(clone(DEFAULT_SETTINGS), c.settings||{}); setBase = clone(S.settings); localSeq = c.seq||0; }
function loadLocal(){ try{ const c = JSON.parse(localStorage.getItem('forma.cache')||'null'); if (c) applyCache(c); else setBase = clone(S.settings); }catch(e){ setBase = clone(S.settings); } }
/* if localStorage lost the latest writes (app killed before flush), IndexedDB still has them */
async function loadMirror(){ const m = await idbGet(); if (m && (m.seq||0) > localSeq){ applyCache(m); try{ localStorage.setItem('forma.cache', JSON.stringify(m)); }catch(e){} return true; } if (!m && localSeq) idbPut(readJSON('forma.cache', null)); return false; }
function markDirty(path){ const d = new Set(readJSON('forma.dirty', [])); d.add(path); writeJSON('forma.dirty', [...d]); }
function unmarkDirty(path){ const d = readJSON('forma.dirty', []).filter(x=>x!==path); writeJSON('forma.dirty', d); }
function readDirty(){ return new Set(readJSON('forma.dirty', [])); }
function writeDoc(path, getData){
  markDirty(path);
  if (!db) return;
  pending.add(path);
  const gen = gens[path] = (gens[path]||0) + 1;
  clearTimeout(timers[path]);
  timers[path] = setTimeout(() => {
    chains[path] = (chains[path]||Promise.resolve()).then(async () => {
      if (!db) return;
      const data = getData();
      const go = () => data===null ? db.doc(path).delete() : db.doc(path).set(data);
      try{ await go(); if (gens[path]===gen) unmarkDirty(path); }
      catch(e){ try{ await new Promise(r=>setTimeout(r,600+Math.random()*600)); await go(); if (gens[path]===gen) unmarkDirty(path); }catch(e2){ showToast('Не удалось сохранить в облако — данные остались на этом устройстве и уйдут позже', null, true); } }
    }).finally(() => { if (gens[path]===gen) pending.delete(path); });
  }, 350);
}
/* days */
let achT = null;
function persistDay(k, resync){
  if (!resync){ clearTimeout(achT); achT = setTimeout(() => { try{ achCheck(); }catch(e){} }, 600); }
  if (!resync){ if (S.days[k]) S.days[k]._ts = Date.now(); else { const t = readJSON('forma.tomb', {}); t[k] = Date.now(); writeJSON('forma.tomb', t); } }
  if (S.days[k]) normDay(S.days[k]);
  if (S.toast && S.toast.undo && S.toast.undo.k===k && !persistDay.undoing && Date.now()-(S.toast.at||0) > 300) hideToast();
  if (!resync && S.days[k]){ const g = readJSON('forma.gone', {}); if (g[k]){ delete g[k]; writeJSON('forma.gone', g); } }
  cacheLocal(); writeDoc('days/'+k, () => { const d = S.days[k]; if (d && !isEmptyDay(d)) return d; const g = readJSON('forma.gone', {})[k]; return g ? {_gone:true, _ts:(readJSON('forma.tomb', {})[k]||Date.now()), _del:g._del||{}} : null; });
}
const goneDay = C => ({food:[], water:[], gym:null, _del:C._del||{}, _ts:C._ts||0});
function keepOrGone(k, r, next){ if (r && !isEmptyDay(r)){ next[k] = r; return; } const g = readJSON('forma.gone', {}); g[k] = {_del:(r&&r._del)||{}}; writeJSON('forma.gone', g); }
function unionById(a, b){ const m = new Map(); (b||[]).forEach(x => m.set(x.id, x)); (a||[]).forEach(x => m.set(x.id, x)); return [...m.values()].sort((x,y)=>(x.t||0)-(y.t||0)); }
/* Both devices edited the same day: keep additions from both sides, honour deletions.
   _del = {itemId: time deleted}; an item is dropped if it was deleted after the version that still has it.
   _wts = time the weight was last set or cleared. */
function mergeDay(L, C){
  const newer = (L._ts||0) >= (C._ts||0) ? L : C, older = newer===L ? C : L, nt = newer._ts||0, ot = older._ts||0;
  const del = Object.assign({}, older._del||{}); Object.entries(newer._del||{}).forEach(([id,t]) => { del[id] = Math.max(del[id]||0, t); });
  const alive = (x, ts) => !(del[x.id] && del[x.id] >= ts);
  const merge = (a, b) => { const m = new Map(); (b||[]).filter(x=>alive(x, ot)).forEach(x => m.set(x.id, x)); (a||[]).filter(x=>alive(x, nt)).forEach(x => m.set(x.id, x)); return [...m.values()].sort((x,y)=>(x.t||0)-(y.t||0)); };
  const r = clone(newer);
  r.food = merge(newer.food, older.food); r.water = merge(newer.water, older.water);
  const wk = merge(newer.walks, older.walks); if (wk.length) r.walks = wk; else delete r.walks;
  const ng = newer.gym, og = older.gym, ex = merge(ng && ng.exercises, og && og.exercises).map(e=>clone(e));
  if (ng || (og && ex.length)){ r.gym = clone(ng || og); r.gym.exercises = ex; if (ng && og){ r.gym.muscles = ex.length ? groupsInDay(r.gym) : [...new Set((ng.muscles||[]).concat(og.muscles||[]))]; if (!r.gym.note && og.note) r.gym.note = og.note; } }
  else r.gym = null;
  const wn = newer._wts||0, wo = older._wts||0;
  if (wo > wn){ if (num(older.weight)) r.weight = older.weight; else delete r.weight; r._wts = wo; }
  else if (!wn && !num(r.weight) && num(older.weight)) r.weight = older.weight;
  r._del = del; r._ts = Math.max(nt, ot);
  return r;
}
function dayIds(d){ return [].concat((d.food||[]).map(x=>x.id), (d.water||[]).map(x=>x.id), (d.walks||[]).map(x=>x.id), ((d.gym&&d.gym.exercises)||[]).map(x=>x.id)).filter(Boolean); }
function editDay(k, fn){
  const before = getDay(k), d = clone(before); fn(d);
  const now = Date.now(), after = new Set(dayIds(d)), del = Object.assign({}, d._del||{});
  dayIds(before).forEach(id => { if (!after.has(id)) del[id] = now; });
  after.forEach(id => { delete del[id]; });
  const lim = now - 120*864e5; Object.keys(del).forEach(id => { if (del[id] < lim) delete del[id]; });
  if (Object.keys(del).length) d._del = del; else delete d._del;
  if (num(before.weight) !== num(d.weight)) d._wts = now;
  if (isEmptyDay(d)){ delete S.days[k]; const g = readJSON('forma.gone', {}); g[k] = {_del:del}; writeJSON('forma.gone', g); } else S.days[k] = d; persistDay(k); }
/* settings: per-field stamps */
const SET_SKIP = new Set(['_ts','_rm','_add']);
const LIST_KEYS = ['customFoods','customEx','favorites','favEx','achSeen'], MAP_KEYS = ['foodOverrides'];
const itemId = x => x && typeof x==='object' ? String(x.name) : String(x);
function stampSettings(){
  const now = Date.now(), ts = Object.assign({}, S.settings._ts||{}), base = setBase || {};
  const rm = Object.assign({}, S.settings._rm||{}), add = Object.assign({}, S.settings._add||{});
  const diff = (k, a, b) => { a.forEach(id => { if (!b.has(id)) rm[k+'|'+id] = now; }); b.forEach(id => { if (!a.has(id)) add[k+'|'+id] = now; }); };
  LIST_KEYS.forEach(k => diff(k, new Set((base[k]||[]).map(itemId)), new Set((S.settings[k]||[]).map(itemId))));
  MAP_KEYS.forEach(k => diff(k, new Set(Object.keys(base[k]||{})), new Set(Object.keys(S.settings[k]||{}))));
  const lim = now - 120*864e5; Object.keys(rm).forEach(x => { if (rm[x] < lim){ delete rm[x]; delete add[x]; } }); Object.keys(add).forEach(x => { if (add[x] < lim && !rm[x]) delete add[x]; });
  if (Object.keys(rm).length) S.settings._rm = rm; else delete S.settings._rm;
  if (Object.keys(add).length) S.settings._add = add; else delete S.settings._add;
  Object.keys(Object.assign({}, base, S.settings)).forEach(k => { if (SET_SKIP.has(k)) return;
    if (k==='profile'){ const a = base.profile||{}, b = S.settings.profile||{}; Object.keys(Object.assign({}, a, b)).forEach(f => { if (stable(a[f])!==stable(b[f])) ts['profile.'+f] = now; }); }
    else if (stable(base[k])!==stable(S.settings[k])) ts[k] = now; });
  S.settings._ts = ts;
}
function mergeSettings(L, C){
  const lt = L._ts||{}, ct = C._ts||{}, out = {}, ts = Object.assign({}, ct);
  const pick = (key, lv, cv, lHas, cHas) => { const a = lt[key]||0, b = ct[key]||0; if (a > b){ ts[key] = a; return {v:lv, has:lHas}; } return cHas ? {v:cv, has:true} : {v:lv, has:lHas}; };
  Object.keys(Object.assign({}, L, C)).forEach(k => { if (SET_SKIP.has(k) || k==='profile') return; const r = pick(k, L[k], C[k], k in L, k in C); if (r.has) out[k] = clone(r.v); });
  const lp = L.profile||{}, cp = C.profile||{}; out.profile = {};
  Object.keys(Object.assign({}, lp, cp)).forEach(f => { const r = pick('profile.'+f, lp[f], cp[f], f in lp, f in cp); if (r.has) out.profile[f] = r.v; });
  // lists & maps: keep additions from both devices, honour deletions (_rm = {"key|item": time removed})
  const mx = (x, y) => { const o = Object.assign({}, x||{}); Object.entries(y||{}).forEach(([i,t]) => { o[i] = Math.max(o[i]||0, t); }); return o; };
  const rm = mx(C._rm, L._rm), add = mx(C._add, L._add), alive = key => !(rm[key] && rm[key] >= (add[key]||0));
  LIST_KEYS.forEach(k => { if (!Array.isArray(L[k]) && !Array.isArray(C[k])) return; const a = lt[k]||0, b = ct[k]||0, newer = (a > b ? L[k] : C[k]) || [], older = (a > b ? C[k] : L[k]) || [];
    const m = new Map(); newer.forEach(x => { const id = itemId(x); if (alive(k+'|'+id)) m.set(id, x); }); older.forEach(x => { const id = itemId(x); if (!m.has(id) && alive(k+'|'+id)) m.set(id, x); });
    out[k] = clone([...m.values()]); });
  MAP_KEYS.forEach(k => { if (!L[k] && !C[k]) return; const a = lt[k]||0, b = ct[k]||0, newer = (a > b ? L[k] : C[k]) || {}, older = (a > b ? C[k] : L[k]) || {}, o = {};
    Object.keys(older).forEach(id => { if (alive(k+'|'+id)) o[id] = older[id]; }); Object.keys(newer).forEach(id => { if (alive(k+'|'+id)) o[id] = newer[id]; }); out[k] = clone(o); });
  if (Object.keys(rm).length) out._rm = rm; if (Object.keys(add).length) out._add = add;
  out._ts = ts; return out;
}
function persistSettings(resync){ if (!resync) stampSettings(); setBase = clone(S.settings); cacheLocal(); writeDoc('settings/main', () => S.settings); }

async function initDb(){
  try{
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use('db');
  }catch(e){ db = null; }
  if (!db) return;
  let first = true;
  db.collection('days').onSnapshot(snap => {
    const cloud = {};
    snap.docs.forEach(d => { if (d.exists) cloud[d.id] = clone(d.data()); });
    if (first){
      first = false;
      if (snap.empty && Object.keys(S.days).length){ Object.keys(S.days).forEach(k => persistDay(k, true)); S.synced = true; render(); return; }
    }
    const dirty = readDirty(), tomb = readJSON('forma.tomb', {}), next = {}, push = [];
    new Set(Object.keys(cloud).concat(Object.keys(S.days))).forEach(k => {
      const L = S.days[k], C0 = cloud[k], p = 'days/'+k, C = C0 && C0._gone ? goneDay(C0) : C0;
      if (pending.has(p)){ if (L){ if (C && stable(C)!==stable(L) && (C._ts||0) > (L._ts||0)) keepOrGone(k, mergeDay(L, C), next); else next[k] = L; } return; }
      if (dirty.has(p)){
        if (L && C){ if (stable(L)===stable(C)){ next[k] = C; unmarkDirty(p); } else { keepOrGone(k, mergeDay(L, C), next); push.push(k); } return; }
        if (L && !C){ next[k] = L; push.push(k); return; }
        if (!L && C){ if ((tomb[k]||0) >= (C._ts||0)){ push.push(k); return; } if (!isEmptyDay(C)) next[k] = C; unmarkDirty(p); return; }
        unmarkDirty(p); return;
      }
      if (C && !isEmptyDay(C)) next[k] = C;
    });
    Object.values(next).forEach(normDay); S.days = next; S.synced = true; cacheLocal();
    push.forEach(k => persistDay(k, true));
    renderSoon();
  }, () => { S.synced = false; renderSoon(); });
  db.doc('settings/main').onSnapshot(snap => {
    if (!snap.exists){ if (stable(S.settings)!==stable(DEFAULT_SETTINGS)) persistSettings(true); return; }
    const C = Object.assign(clone(DEFAULT_SETTINGS), clone(snap.data()));
    const M = mergeSettings(S.settings, C);
    S.settings = M; setBase = clone(M); cacheLocal();
    if (stable(M)!==stable(C)) writeDoc('settings/main', () => S.settings);
    else unmarkDirty('settings/main');
    renderSoon();
  }, () => {});
}

/* ---------- render scheduling ---------- */
let deferred = false;
function renderSoon(){
  const a = document.activeElement;
  if (a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT') && $('#app').contains(a)){ deferred = true; return; }
  render();
}
document.addEventListener('focusout', () => { if (deferred){ setTimeout(() => { const a=document.activeElement; if (!(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'))){ deferred=false; render(); } }, 50); } });

function ring(val, goal, big, sub, extra){

}

function weightMini(t, tw){
  const all = weightEntries();
  if (all.length<2) return `<div class="hint" style="margin:6px 0 0">Запиши вес ещё в другой день — здесь появится график изменения.</div>`;
  const per = S.wmPer || 'day';
  const lab = k => { const dd = parseKey(k); return `${dd.getDate()} ${MON_S[dd.getMonth()]}`; };
  const avg = a => a.reduce((x,y)=>x+y,0)/a.length;
  let pts, cap;
  if (per==='day'){ pts = all.filter(e=>e.k>=addDays(t,-29)).map(e=>({k:e.k, kg:e.kg, l:lab(e.k)})); if (pts.length<2) pts = all.slice(-10).map(e=>({k:e.k, kg:e.kg, l:lab(e.k)})); cap = 'по дням'; }
  else if (per==='week'){ const g = {}; all.filter(e=>e.k>=addDays(mondayOf(t),-7*11)).forEach(e=>{ const w = mondayOf(e.k); (g[w]=g[w]||[]).push(e.kg); });
    pts = Object.keys(g).sort().map(w=>({k:w, kg:avg(g[w]), l:`нед. ${lab(w)}`})); cap = 'среднее за неделю';
    if (pts.length<2){ const g2 = {}; all.forEach(e=>{ const w = mondayOf(e.k); (g2[w]=g2[w]||[]).push(e.kg); }); pts = Object.keys(g2).sort().slice(-12).map(w=>({k:w, kg:avg(g2[w]), l:`нед. ${lab(w)}`})); } }
  else { const g = {}; all.forEach(e=>{ const m = e.k.slice(0,7); (g[m]=g[m]||[]).push(e.kg); });
    pts = Object.keys(g).sort().slice(-12).map(m=>({k:m+'-15', kg:avg(g[m]), l:MON_S[+m.slice(5)-1]})); cap = 'среднее за месяц'; }
  const seg = `<div class="seg wm-seg" role="group" aria-label="Период">${[['day','Дни'],['week','Недели'],['month','Месяцы']].map(([v,n])=>`<button data-a="wmper" data-p="${v}" aria-pressed="${per===v}">${n}</button>`).join('')}</div>`;
  if (pts.length<2) return `<div class="wmini">${seg}<div class="hint" style="margin:8px 0 6px">Пока записи только за ${per==='week'?'одну неделю':'один месяц'} — ${per==='week'?'нужны взвешивания хотя бы в двух разных неделях':'нужны записи хотя бы в двух разных месяцах'}.</div></div>`;
  const W=320,H=96,L=6,R=6,T=14,B=18;
  const t0 = parseKey(pts[0].k).getTime(), t1 = parseKey(pts[pts.length-1].k).getTime(), span = Math.max(1, t1-t0);
  const ys = pts.map(e=>e.kg); let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = Math.max(0.4, (hi-lo)*0.2); lo -= pad; hi += pad;
  const X = e => L + (W-L-R)*(parseKey(e.k).getTime()-t0)/span, Y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  const d = pts.map((e,i)=>`${i?'L':'M'}${X(e).toFixed(1)} ${Y(e.kg).toFixed(1)}`).join(' ');
  const area = `${d} L${X(pts[pts.length-1]).toFixed(1)} ${H-B} L${X(pts[0]).toFixed(1)} ${H-B} Z`;
  const f = pts[0], l = pts[pts.length-1], dl = l.kg - f.kg;
  const tgt = tw && tw>lo && tw<hi ? `<line class="wm-tg" x1="${L}" x2="${W-R}" y1="${Y(tw)}" y2="${Y(tw)}"/><text class="wm-tt" x="${W-R}" y="${Y(tw)-4}" text-anchor="end">цель ${fmt1(tw)}</text>` : '';
  return `<div class="wmini">${seg}<div class="wm-top"><span class="muted">${cap}</span><b class="${dl<=0?'goodc':'warnc'}">${dl>0?'+':dl<0?'−':''}${fmt1(Math.abs(dl))} кг</b></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Вес ${cap}: от ${fmt1(f.kg)} до ${fmt1(l.kg)} кг">${tgt}<path class="wm-a" d="${area}"/><path class="wm-l" d="${d}"/>
    ${pts.map((e,i)=>`<circle class="wm-p ${i===pts.length-1?'last':''}" cx="${X(e).toFixed(1)}" cy="${Y(e.kg).toFixed(1)}" r="${i===pts.length-1?4:2.5}"><title>${e.l}: ${fmt1(e.kg)} кг</title></circle>`).join('')}
    <text class="wm-x" x="${L}" y="${H-3}">${f.l} · ${fmt1(f.kg)}</text><text class="wm-x" x="${W-R}" y="${H-3}" text-anchor="end">${l.l} · ${fmt1(l.kg)}</text></svg></div>`;

function sparkline(vals, w, h){
  const pts = vals.map((v,i)=>[i,v]).filter(p=>p[1]!==null); if (pts.length<2) return '';
  const ys = pts.map(p=>p[1]); let lo = Math.min(...ys), hi = Math.max(...ys); if (hi-lo<0.6){ hi+=0.3; lo-=0.3; }
  const X = i => 2 + (w-4)*i/(vals.length-1), Y = v => 3 + (h-6)*(1-(v-lo)/(hi-lo));
  const d = pts.map((p,j)=>`${j?'L':'M'}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(' ');
  const l = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}"/><circle cx="${X(l[0])}" cy="${Y(l[1])}" r="3"/></svg>`;

function weightTrend(days){
  const es = weightEntries(); if (!es.length) return null;

  const from = addDays(t, -days), lo = addDays(t, -Math.round(days*1.5));

function progBars(items, unit, f){

  const pw = (W-L-R)/n, bw = Math.max(2, pw*0.62), y = v => T + (H-T-B)*(1-v/hi);
  let g = '';
  for (let v=0; v<=hi+1e-9; v+=step) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v>=10000?fmtK(v):fmt1(v)}</text>`;
  const bars = items.map((it,i)=>{ const x0 = L+i*pw+(pw-bw)/2, last = i===n-1;
    let out = `<text class="axis" x="${L+i*pw+pw/2}" y="${H-6}" text-anchor="middle">${it.lab}</text>`;
    if (it.v>0){ const tp = y(it.v), r = Math.min(4, bw/2, (H-B)-tp); out += `<path class="bar ${last?'':'soft'}" d="M${x0} ${H-B} V${tp+r} Q${x0} ${tp} ${x0+r} ${tp} H${x0+bw-r} Q${x0+bw} ${tp} ${x0+bw} ${tp+r} V${H-B} Z"><title>${it.tip}: ${f(it.v)} ${unit}</title></path>`;
      if (n<=8) out += `<text class="axis" x="${x0+bw/2}" y="${tp-5}" text-anchor="middle">${it.v>=10000?fmtK(it.v):f(it.v)}</text>`; }
    return out; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График, ${unit}" style="margin-top:8px">${g}${bars}<line class="base" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/></svg>`;
}
function progStrength(name, kind){
  const pts = [];
  gymSessions().forEach(s => (s.g.exercises||[]).filter(e=>e.name===name).forEach(e => {
    const ss = (e.sets||[]).filter(x=>num(x.w)>0||num(x.r)>0); if (!ss.length) return;
    let w = 0, r = 0; ss.forEach(x=>{ const ww = num(x.w), rr = num(x.r); if (ww>w || (ww===w && rr>r)){ w = ww; r = rr; } });
    const maxR = Math.max(...ss.map(x=>num(x.r))), totR = ss.reduce((a,x)=>a+num(x.r),0);
    pts.push({k:s.k, w, r, v: kind==='w' ? w : maxR, totR, n:ss.length, sum:setsSummary(e), short: kind==='w' ? `${fmt1(w)} × ${r}` : ss.map(x=>fmt(num(x.r))).join(' · ')});

  let hh = `<div class="hint" style="margin-top:8px">${kind==='w' ? 'Рабочий вес — самый тяжёлый подход за тренировку.' : kind==='sec' ? 'Лучшее время в подходе за тренировку.' : 'Максимум повторений в одном подходе за тренировку.'}</div>`;

  hh += `<div class="pr"><div><i class="pri">${MI.trophy}</i><b class="num">${fmt1(best.v)} ${unit}</b><span>рекорд${kind==='w'?` · ${best.r} повт`:''} · ${dayLabel(best.k)}</span></div>

}

  big:'<path d="M9.5 2h5v2.5l2.5 3V20a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V7.5l2.5-3z"/><path d="M7 11h10M7 16h10"/>'
};
function volIcon(v){ const k = v<=180?'cup':v<=280?'glass':v<=350?'mug':v<=550?'bottle':'big'; return `<svg class="volic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${VOL_IC[k]}</svg>`; }
function volName(v){ return v<=180?'чашка':v<=280?'стакан':v<=350?'кружка':v<=550?'бутылка':'большая бутылка'; }
function sheetWaterEdit(){
  const sh = S.sheet;
  const b = `<div class="card sgroup"><div class="sub" style="margin:0">Напиток</div><div class="dgrid">${DRINKS.map(([id,n,c,ic])=>`<button class="dtile" data-a="wetype" data-id="${id}" aria-pressed="${sh.kind===id}" style="--dc:${c}"><span class="dic">${ic}</span><span>${n}</span></button>`).join('')}</div>
    <div class="srow"><span>Объём</span>${nstep('weml', sh.ml, 50, 'мл', 'data-a="weml"', true)}</div>
    <div class="srow"><span>Время</span><input class="field num timef" id="wetime" type="time" value="${sh.time}" data-a="wetime"></div>
    <button class="btn big" data-a="wesave">Сохранить</button><button class="btn danger" data-a="wedel">Удалить запись</button></div>`;
  return {title:'Изменить запись', body:b};
}
function sheetWaterPresets(){
  const sh = S.sheet;
  const b = `<div class="card sgroup"><div class="hint" style="margin:0">Кнопки быстрого добавления на экране «Вода». Можно 2–6 штук.</div>
    ${sh.list.map((v,i)=>`<div class="srow"><span>${i+1}. ${volName(num(v))}</span><span class="row" style="gap:6px;flex:0 1 240px">${nstep('wp-'+i, v, 50, 'мл', `data-a="wpv" data-i="${i}"`)}${sh.list.length>2?`<button class="del" data-a="wpdel" data-i="${i}" aria-label="Убрать кнопку">${I.x}</button>`:''}</span></div>`).join('')}
    ${sh.list.length<6?`<button class="add" data-a="wpadd">${I.plus} Кнопка</button>`:''}
    <button class="btn big" data-a="wpsave">Сохранить</button></div>`;
  return {title:'Быстрые кнопки', body:b};
}
function readBar(ev){
  const r = ev.target.closest && ev.target.closest('#kchart .hit'); if (!r) return;
  const o = $('#calread'); if (!o) return; const k = r.dataset.k, v = r.dataset.v;
  document.querySelectorAll('#kchart .hit.on').forEach(x=>x.classList.remove('on')); r.classList.add('on');
  const mode = (S.sheet&&S.sheet.mode)||'food', g = calGoal(mode, k), n = +v;
  let txt;
  if (v==='') txt = mode==='gym' ? 'нет тренировки' : 'нет записей';
  else if (mode==='food') txt = `<b class="num">${fmt(n)} ккал</b>${n>g?` · на ${fmt(n-g)} больше цели`:''}`;
  else if (mode==='water') txt = `<b class="num">${fmt(n)} мл</b>${n>=g?' · норма выполнена':` · до нормы ${fmt(g-n)} мл`}`;
  else { const gy = S.days[k]&&S.days[k].gym; txt = `<b class="num">${fmt(n)} кг</b>${dayBurn(k)?` · ${kcalTxt(dayBurn(k))}`:''}${gy&&gy.muscles&&gy.muscles.length?' · '+esc(gy.muscles.join(', ')):''}`; }
  o.innerHTML = `${WD_FULL[wdIdx(k)]}, ${dayLabel(k)}: ${txt}`;
}
document.addEventListener('mouseover', readBar);
document.addEventListener('click', readBar);
document.addEventListener('input', ev => {
  const el = ev.target; const a = el.dataset && el.dataset.a; if (!a) return; const sh = S.sheet;
  if (a==='fq'){ sh.q = el.value; sh.sel = null; const pick = $('.pick'); if (pick) pick.remove(); $('#fres').innerHTML = foodResults(); }
  else if (a==='wkg'){ sh.kg = el.value; }
  else if (a==='weml'){ sh.ml = el.value; }
  else if (a==='wetime'){ sh.time = el.value; }
  else if (a==='wpv'){ sh.list[+el.dataset.i] = el.value; }
  else if (a==='feqty'){ sh.qty = el.value; const e = sh.entry, base = feBase(e), k = num(el.value)/base; const o = $('#femac'); if (o) o.textContent = `${fmt(e.kcal*k)} ккал · Б ${fmt1(e.p*k)} · Ж ${fmt1(e.f*k)} · У ${fmt1(e.c*k)}`; }
  else if (a==='fqty'){ sh.qty = el.value; const q = num(el.value); $('#fsum').innerHTML = pickSum(sh); document.querySelectorAll('[data-a="fqtyset"]').forEach(c=>c.setAttribute('aria-pressed', String(num(c.dataset.v)===q))); }
  else if (a==='man'){ sh.man[el.dataset.f] = el.value; }
  else if (a==='np'){ sh.np[el.dataset.f] = el.value; }
  else if (a==='em'){ sh.em[el.dataset.f] = el.value; const o = $('#emk'); if (o) o.textContent = fmt(emKcalFor(sh.sel, sh.em)); syncEm(); }
  else if (a==='gname'){ if (sh.form){ const was = isDb(sh.form.name); sh.form.name = el.value; queueDrafts(); if (isDb(el.value)!==was){ const pos = el.selectionStart; render(); const i = $('#gname'); if (i){ i.focus(); try{ i.setSelectionRange(pos,pos); }catch(e){} } } } }
  else if (a==='grename'){ sh.rn = el.value; }
  else if (a==='gq'){ const was = !!sh.gq; sh.gq = el.value; if (was !== !!sh.gq){ render(); const i = $('#gq'); if (i){ i.focus(); try{ i.setSelectionRange(i.value.length, i.value.length); }catch(e){} } } else { const r = $('#gqres'); if (r) r.innerHTML = gSearch(el.value); } }
  else if (a==='gdur'){ const d = S.days[sh.key]; if (d&&d.gym){ d.gym.duration = num(el.value); persistDay(sh.key); } }
  else if (a==='gf'){ sh.form[el.dataset.f] = el.value; queueDrafts(); const t = $('#gtotal'); if (t) t.innerHTML = formTotal(sh.form); syncSave(); }
  else if (a==='gps'){ sh.form.sets[+el.dataset.si][el.dataset.f] = el.value; queueDrafts(); const t = $('#gtotal'); if (t) t.innerHTML = formTotal(sh.form); syncSave(); }
  else if (a==='wkf'){ sh[el.dataset.f] = el.value; const c = $('#wkcalc'); if (c) c.innerHTML = walkCalc(); const bt = $('[data-a="wksave"]'); if (bt) bt.disabled = !(num(sh.steps)>0); }
  else if (a==='gcrails'){ sh.form.cs.forEach(c=>{ c.rails = el.checked; }); syncCardio(); }
  else if (a==='gcf'){ const si = +el.dataset.si||0; sh.form.cs[si][el.dataset.f] = el.value; queueDrafts(); syncCardio(); }
  else if (a==='gnote'){ const d = S.days[sh.key]; if (d&&d.gym){ d.gym.note = el.value; persistDay(sh.key); } }
  else if (a==='sset'){ const v = num(el.value); const allowZero = el.dataset.f==='profile.targetWeight'; if (el.value.trim()==='' && !allowZero) return; if (v>0 || (allowZero && (el.value.trim()==='' || v>=0))){ setPath(S.settings, el.dataset.f, el.value.trim()===''?0:v); persistSettings(); clearTimeout(window.__srt); window.__srt = setTimeout(()=>renderSoon(), 700); } }
  else if (a==='sgoal'){ const v = num(el.value); if (v>0){ S.settings[el.dataset.f] = Math.round(v); persistSettings(); } }
  else if (a==='prof'){ S.settings.profile = Object.assign({}, S.settings.profile, {[el.dataset.f]: el.tagName==='SELECT'? num(el.value) : el.value}); persistSettings(); const c = calcGoal(S.settings.profile); const o=$('#calcout'); if (o){ const bs = o.querySelectorAll('b'); bs[0].textContent = fmt(c.kcal)+' ккал'; bs[1].textContent = fmt(c.water)+' мл'; } }
});
document.addEventListener('change', ev => {
  const el = ev.target; const a = el.dataset && el.dataset.a;
  if (a==='progex'){ S.progEx = el.value; el.blur(); render(); }
  else if (a==='mansave'){ S.sheet.man.save = el.checked; }
  else if (a==='importfile'){ const f = el.files && el.files[0]; if (f) doImport(f); el.value = ''; }
  else if (a==='gper'){ const f = S.sheet.form; f.per = el.checked; if (f.per){ f.sets = formSets(Object.assign({}, f, {per:false})).map(x=>({w:String(x.w),r:String(x.r)})); } else if (f.sets.length){ f.w = f.sets[0].w; f.r = f.sets[0].r; f.n = f.sets.length; } render(); }
  else if (a==='prof' && el.tagName==='SELECT'){ /* handled on input */ }
});
document.addEventListener('keydown', ev => {
  if (ev.key==='Escape' && S.sheet){ S.sheet=null; render(); }
  if (ev.key==='Enter' && ev.target.id==='wml'){ ev.preventDefault(); document.querySelector('[data-a="addwatercustom"]').click(); }
  if (ev.key==='Enter' && ev.target.id==='fqty'){ ev.preventDefault(); document.querySelector('[data-a="fadd"]').click(); }
  if (ev.key==='Enter' && ev.target.id==='grename'){ ev.preventDefault(); document.querySelector('[data-a="gmyrensave"]')?.click(); return; }
  if (ev.key==='Enter' && ev.target.id==='gname'){ ev.preventDefault(); ev.target.blur(); }
});
// keep "today" fresh if the page stays open past midnight
let lastToday = today();
setInterval(() => { const t = today(); if (t!==lastToday){ if (S.date===lastToday) S.date = t; if (S.week===mondayOf(lastToday)) S.week = mondayOf(t); if (S.walkWeek===mondayOf(lastToday)) S.walkWeek = mondayOf(t); lastToday = t; renderSoon(); } }, 60000);

/* before the first run of a new app version, keep an untouched copy of the data (rescue point if an update ever misbehaves) */
function preUpdateSnapshot(){ try{ const prev = localStorage.getItem('forma.ver'); if (prev === APP_VERSION) return; const c = localStorage.getItem('forma.cache'); if (c && c.length > 20) localStorage.setItem('forma.preupdate', JSON.stringify({from:prev||'?', to:APP_VERSION, at:new Date().toISOString(), cache:c})); localStorage.setItem('forma.ver', APP_VERSION); }catch(e){} }
preUpdateSnapshot();
/* ---------- no zoom anywhere ----------
   iOS Safari ignores user-scalable=no, so block its gesture events, multi-touch moves and quick double taps;
   on desktop block Ctrl/⌘ + wheel (trackpad pinch) and Ctrl/⌘ + plus/minus/0. */
(function noZoom(){
  const opt = {passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), opt));
  let multi = false, sx = 0, sy = 0, moved = false, lastTap = 0;
  document.addEventListener('touchstart', e => { if (e.touches.length > 1){ multi = true; e.preventDefault(); return; } if (!multi){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; moved = false; } }, opt);
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)){ multi = true; e.preventDefault(); return; } const t = e.touches[0]; if (t && Math.hypot(t.clientX-sx, t.clientY-sy) > 10) moved = true; }, opt);
  document.addEventListener('touchend', e => {
    if (multi){ if (!e.touches.length) multi = false; e.preventDefault(); lastTap = 0; return; }   // end of a pinch: never a tap
    if (moved){ lastTap = 0; return; }                                                                 // scroll, not a tap
    const now = Date.now(), t = e.target, typing = t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT' || t.isContentEditable);
    if (!typing && now - lastTap < 350){ e.preventDefault(); const c = t && t.closest && t.closest('button,a,label,[role="button"],[data-a]:not([data-a="closebg"]):not(.overlay)'); if (c && !c.classList.contains('overlay') && !(c.disabled)) c.click(); lastTap = 0; return; }   // 2nd quick tap: no zoom, still a click
    lastTap = now; }, opt);
  document.addEventListener('dblclick', e => e.preventDefault(), opt);
  window.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, opt);
  window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+','-','=','_','0'].includes(e.key)) e.preventDefault(); });
})();
try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
loadLocal();
if ('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
loadMirror().then(ch => { if (ch) render(); return initDb(); }).then(render);
// another tab/window of the app saved newer data → take it instead of later overwriting it
window.addEventListener('storage', ev => { if (ev.key!=='forma.cache' || !ev.newValue) return; try{ const c = JSON.parse(ev.newValue); if ((c.seq||0) > localSeq){ applyCache(c); renderSoon(); } }catch(e){} });
initDownloads();
setTimeout(() => { try{ achInit(); }catch(e){} }, 2500);   // after cloud sync had a chance to bring achSeen
})();
